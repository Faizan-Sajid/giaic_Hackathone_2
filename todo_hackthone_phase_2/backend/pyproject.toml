[project]
name = "taskflow-backend"
version = "1.0.0"
description = "TaskFlow AI Backend - Phase II Full-Stack Web Application"
authors = [{name = "TaskFlow AI Team"}]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.0.0",
    "uvicorn>=0.30.0",
    "asyncpg>=0.29.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "email-validator>=2.3.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
